# The release version: the Maven artifacts and the SDK's reported library version both use it.
VERSION_NAME=0.1.0
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Never let AGP silently install SDK packages; missing packages must fail loudly.
android.builder.sdkDownload=false
# AGP 9 built-in Kotlin is disabled so the standard Kotlin Android plugin is applied: the
# binary-compatibility-validator (and Kotlin's own ABI tooling) cannot see built-in-Kotlin classes.
android.builtInKotlin=false
android.newDsl=false
