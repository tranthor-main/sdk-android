name: Publish to Maven Central

# Started by hand for a released tag. Uploads both library modules to Maven
# Central, signed. The upload is then released from the Central Portal.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to publish, for example 0.3.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platforms;android-36 build-tools;36.1.0 platform-tools
      - name: The tag matches the version being published
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="$(sed -n 's/^VERSION_NAME=//p' gradle.properties)"
          if [ "$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match VERSION_NAME $version"
            exit 1
          fi
      - name: Upload to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew publishToMavenCentral --no-daemon --no-configuration-cache
