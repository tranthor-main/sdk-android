name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platforms;android-36 build-tools;36.1.0 platform-tools
      # Assemble, lint, unit tests (core + push) and the binary-compatibility API check.
      - run: ./gradlew build --no-daemon
      # FCM sender script tests (local stub, no network or credentials).
      - run: node --test scripts/send-fcm-push.test.mjs
      # JVM conformance against the vendored mock server (lifecycle scenarios are skipped on the JVM).
      - run: scripts/test-host.sh --no-daemon
      # Emulator conformance and example UI tests are local-only (scripts/test-emulator.sh --example).
